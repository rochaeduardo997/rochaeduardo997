name: profile-stats

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats and contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_profile_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-dark.svg assets/langs.svg assets/langs-dark.svg assets/code-contribution-graph.svg assets/code-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            echo "Sem mudancas nos graficos."
          else
            git commit -m "Atualiza estatisticas e contribuicoes do perfil"
            git push
          fi
